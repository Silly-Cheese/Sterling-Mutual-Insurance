name: Sterling Integration Build
on:
  pull_request:
  push:
    branches:
      - release/sterling-phases-1-to-5
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.js
      - run: npm run build
